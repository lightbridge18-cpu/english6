<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>六上英语闯关站</title>
<style>
:root{--g:#58cc02;--gd:#46a302;--b:#1cb0f6;--r:#ff4b4b;--y:#ffc800;--ink:#3c3c3c;--mute:#777;--line:#e5e5e5;--bg:#f7f7f7}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font-family:"Nunito","PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--ink)}
.wrap{max-width:560px;margin:0 auto;min-height:100vh;background:#fff;padding-bottom:90px}
header{position:sticky;top:0;background:#fff;border-bottom:2px solid var(--line);display:flex;justify-content:space-around;padding:12px 8px;z-index:5;font-weight:800}
header span{display:flex;align-items:center;gap:4px}
h1{font-size:22px;text-align:center;margin:18px 0 4px}
.sub{text-align:center;color:var(--mute);font-size:14px;margin-bottom:10px}
.daily{margin:12px 16px;padding:14px;border:2px solid var(--line);border-radius:16px}
.bar{height:14px;background:var(--line);border-radius:10px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--g);border-radius:10px;transition:width .4s}
.path{display:flex;flex-direction:column;align-items:center;gap:22px;padding:24px 0}
.unit{display:flex;flex-direction:column;align-items:center;gap:6px;cursor:pointer}
.node{width:84px;height:84px;border-radius:50%;background:var(--g);box-shadow:0 7px 0 var(--gd);display:flex;align-items:center;justify-content:center;font-size:38px;position:relative}
.node.lock{background:#e5e5e5;box-shadow:0 7px 0 #c9c9c9;filter:grayscale(1)}
.node .st{position:absolute;bottom:-10px;background:#fff;border:2px solid var(--line);border-radius:10px;font-size:12px;padding:0 6px}
.unit b{font-size:15px}.unit small{color:var(--mute)}
nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:560px;background:#fff;border-top:2px solid var(--line);display:flex}
nav button{flex:1;border:0;background:none;padding:10px 0;font-size:22px;cursor:pointer}
nav button small{display:block;font-size:11px;color:var(--mute)}
nav button.on small{color:var(--b);font-weight:800}
.btn{display:block;width:100%;border:0;border-radius:14px;padding:14px;font-size:17px;font-weight:800;color:#fff;background:var(--g);box-shadow:0 4px 0 var(--gd);cursor:pointer;margin-top:10px}
.btn.blue{background:var(--b);box-shadow:0 4px 0 #1899d6}.btn.gray{background:#e5e5e5;color:#aaa;box-shadow:none}
.btn.ghost{background:#fff;color:var(--b);border:2px solid var(--line);box-shadow:0 4px 0 var(--line)}
.page{padding:16px}
.menu .card{border:2px solid var(--line);border-radius:16px;padding:14px;margin:10px 0;cursor:pointer;display:flex;gap:12px;align-items:center}
.menu .card div{flex:1}.menu .card small{color:var(--mute);display:block}
.lesson{position:fixed;inset:0;background:#fff;z-index:20;display:flex;flex-direction:column;max-width:560px;margin:0 auto}
.ltop{display:flex;align-items:center;gap:12px;padding:14px 16px}
.ltop .x{font-size:24px;cursor:pointer;color:#aaa;border:0;background:none}
.ltop .bar{flex:1}
.q{flex:1;padding:8px 18px;overflow:auto}
.q h2{font-size:21px;margin:8px 0 18px}
.prompt{display:flex;align-items:center;gap:12px;margin-bottom:18px;font-size:20px}
.spk{width:64px;height:64px;border-radius:16px;border:0;background:var(--b);box-shadow:0 4px 0 #1899d6;color:#fff;font-size:28px;cursor:pointer;flex:none}
.opts{display:grid;gap:10px}
.opt{border:2px solid var(--line);border-bottom-width:4px;border-radius:14px;padding:14px;font-size:18px;background:#fff;cursor:pointer;text-align:left}
.opt.sel{border-color:#84d8ff;background:#ddf4ff;color:#1899d6}
.opt.good{border-color:var(--g);background:#d7ffb8}.opt.bad{border-color:var(--r);background:#ffdfe0}
input.ans{width:100%;font-size:22px;padding:14px;border:2px solid var(--line);border-radius:14px;background:#f7f7f7}
.tiles{display:flex;flex-wrap:wrap;gap:8px;min-height:58px;border-bottom:2px solid var(--line);padding:8px 0;margin-bottom:16px}
.tile{border:2px solid var(--line);border-bottom-width:4px;border-radius:12px;padding:8px 12px;font-size:17px;background:#fff;cursor:pointer}
.tile.used{visibility:hidden}
.foot{padding:16px;border-top:2px solid var(--line)}
.foot.ok{background:#d7ffb8;color:var(--gd)}.foot.no{background:#ffdfe0;color:#ea2b2b}
.foot .msg{font-weight:800;font-size:18px;margin-bottom:4px}
.done{text-align:center;padding:40px 20px}
.done .big{font-size:72px}
.stats{display:flex;gap:10px;justify-content:center;margin:20px 0}
.stats div{border:2px solid var(--y);border-radius:14px;padding:10px 14px;font-weight:800}
table{width:100%;border-collapse:collapse;font-size:14px}td,th{border-bottom:1px solid var(--line);padding:8px 4px;text-align:left}
.badges{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.badge{text-align:center;border:2px solid var(--line);border-radius:14px;padding:10px;font-size:13px}
.badge.off{opacity:.3;filter:grayscale(1)}.badge i{font-size:30px;display:block;font-style:normal}
.story{font-size:18px;line-height:1.7;background:#fffbe6;border-radius:14px;padding:14px}
label.row{display:flex;justify-content:space-between;align-items:center;margin:10px 0}
</style>
</head>
<body>
<div class="wrap">
  <header><span>🔥 <b id="hStreak">0</b></span><span>💎 <b id="hXp">0</b></span><span>❤️ <b id="hHeart">5</b></span></header>
  <main id="main"></main>
</div>
<nav>
  <button data-tab="learn" class="on">🏠<small>闯关</small></button>
  <button data-tab="review">📕<small>错题本</small></button>
  <button data-tab="me">🏅<small>成就</small></button>
  <button data-tab="parent">👨‍👩‍👧<small>家长</small></button>
</nav>
<div id="lesson" class="lesson" style="display:none"></div>

<script src="data.js"></script>
<script>
const KEY="pep6a_v1";
const today=()=>new Date().toLocaleDateString("sv");
let S=JSON.parse(localStorage.getItem(KEY)||"null")||{xp:0,hearts:5,heartDay:today(),streak:0,lastDay:"",days:{},unit:{},wrong:{},goal:30,limit:30,pin:""};
function save(){localStorage.setItem(KEY,JSON.stringify(S));hdr()}
if(S.heartDay!==today()){S.hearts=5;S.heartDay=today();save()}
function dayRec(){return S.days[today()]||(S.days[today()]={xp:0,min:0,right:0,total:0})}
function hdr(){hStreak.textContent=S.streak;hXp.textContent=S.xp;hHeart.textContent=S.hearts}

// ---- speech ----
function say(t,rate=.85){try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang="en-US";u.rate=rate;
  const v=speechSynthesis.getVoices().find(v=>/en-US/.test(v.lang));if(v)u.voice=v;speechSynthesis.speak(u)}catch(e){}}
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;

// ---- helpers ----
const shuf=a=>a.map(x=>[Math.random(),x]).sort((p,q)=>p[0]-q[0]).map(x=>x[1]);
const pick=(a,n)=>shuf(a).slice(0,n);
const norm=s=>s.toLowerCase().replace(/[^a-z' ]/g,"").replace(/\s+/g," ").trim();
const esc=s=>s.replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function unlocked(u){return u.id===1||(S.unit[u.id-1]||0)>=1}

// ---- tabs ----
let tab="learn";
document.querySelectorAll("nav button").forEach(b=>b.onclick=()=>{
  if(b.dataset.tab==="parent"&&S.pin){const p=prompt("家长密码");if(p!==S.pin)return}
  tab=b.dataset.tab;document.querySelectorAll("nav button").forEach(x=>x.classList.toggle("on",x===b));render()});

function render(){hdr();const m=document.getElementById("main");
  if(tab==="learn")m.innerHTML=learnView();
  if(tab==="review")m.innerHTML=reviewView();
  if(tab==="me")m.innerHTML=meView();
  if(tab==="parent")m.innerHTML=parentView();
  bind()}

function learnView(){const d=dayRec();const pct=Math.min(100,d.xp/S.goal*100);
  return `<h1>六年级上册 · 英语闯关</h1><div class="sub">人教PEP 2026新版 · 每天一点点</div>
  <div class="daily"><b>今日目标 ${d.xp}/${S.goal} XP</b><div class="bar" style="margin-top:8px"><i style="width:${pct}%"></i></div>
  <small style="color:#777">今天已学 ${Math.round(d.min)} 分钟${S.limit?` · 上限 ${S.limit} 分钟`:""}</small></div>
  <div class="path">${UNITS.map((u,i)=>{const lv=S.unit[u.id]||0;const ok=unlocked(u);
    return `<div class="unit" data-u="${u.id}" style="margin-left:${[0,90,0,-90][i%4]}px"><div class="node ${ok?"":"lock"}">${ok?u.icon:"🔒"}<span class="st">${"⭐".repeat(Math.min(lv,3))||"开始"}</span></div>
    <b>Unit ${u.id} ${u.title}</b><small>${u.cn}</small></div>`}).join("")}</div>`}

function unitMenu(u){const m=document.getElementById("main");
  m.innerHTML=`<div class="page menu"><button class="btn ghost" id="back">← 返回地图</button>
  <h1>${u.icon} Unit ${u.id}</h1><div class="sub">${u.title} · ${u.cn}</div>
  <div class="card" data-m="words">📖<div><b>单词闯关</b><small>听音选词 · 看词选义 · 拼写</small></div></div>
  <div class="card" data-m="sent">🧩<div><b>句子闯关</b><small>连词成句 · 听写 · 中英配对</small></div></div>
  <div class="card" data-m="speak">🎤<div><b>开口说</b><small>跟读单词和句子（建议用 Chrome）</small></div></div>
  <div class="card" data-m="mix">⚡<div><b>单元挑战</b><small>全题型混合 · 通关得⭐</small></div></div>
  <div class="card" data-m="story">📚<div><b>小故事</b><small>听读本单元短文</small></div></div>
  <div class="card" data-m="list">🗒️<div><b>词汇表</b><small>点读全部单词句子</small></div></div></div>`;
  back.onclick=render;
  m.querySelectorAll("[data-m]").forEach(c=>c.onclick=()=>{const k=c.dataset.m;
    if(k==="story")return storyView(u);if(k==="list")return listView(u);startLesson(u,k)})}

function storyView(u){main.innerHTML=`<div class="page"><button class="btn ghost" id="back">← 返回</button>
  <h1>📚 Story</h1><div class="story">${esc(u.story)}</div><button class="btn blue" id="play">🔊 听故事</button><button class="btn ghost" id="slow">🐢 慢速</button></div>`;
  back.onclick=()=>unitMenu(u);play.onclick=()=>say(u.story,.9);slow.onclick=()=>say(u.story,.6)}
function listView(u){main.innerHTML=`<div class="page"><button class="btn ghost" id="back">← 返回</button><h1>🗒️ 词汇表</h1>
  <table>${u.words.map(w=>`<tr data-s="${esc(w[0])}"><td>🔊 <b>${esc(w[0])}</b></td><td>${w[1]}</td></tr>`).join("")}</table><h3>句型</h3>
  <table>${u.sentences.map(s=>`<tr data-s="${esc(s[0])}"><td>🔊 ${esc(s[0])}<br><small style="color:#777">${s[1]}</small></td></tr>`).join("")}</table></div>`;
  back.onclick=()=>unitMenu(u);main.querySelectorAll("[data-s]").forEach(r=>r.onclick=()=>say(r.dataset.s))}

// ---- question generators ----
function qListen(u,w){return{t:"listen",h:"听音，选出你听到的单词",audio:w[0],opts:shuf([w,...pick(u.words.filter(x=>x!==w),3)]).map(x=>x[0]),ans:w[0],item:w}}
function qMean(u,w){return{t:"mean",h:`“${w[0]}” 是什么意思？`,audio:w[0],opts:shuf([w,...pick(u.words.filter(x=>x!==w),3)]).map(x=>x[1]),ans:w[1],item:w}}
function qSpell(u,w){return{t:"spell",h:`拼写：${w[1]}`,audio:w[0],ans:w[0],item:w}}
function qOrder(u,s){const ws=s[0].replace(/[.?!]$/,"").split(" ");return{t:"order",h:`连词成句：${s[1]}`,audio:s[0],tiles:shuf(ws),ans:ws.join(" "),item:s}}
function qDict(u,s){return{t:"spell",h:"听写句子（标点可省略）",audio:s[0],hideAudioText:1,ans:s[0],item:s}}
function qSent(u,s){return{t:"mean",h:`选出正确的英文：${s[1]}`,opts:shuf([s,...pick(u.sentences.filter(x=>x!==s),2)]).map(x=>x[0]),ans:s[0],item:s}}
function qSpeak(u,x){return{t:"speak",h:"读出这句话",audio:x[0],text:x[0],ans:x[0],item:x}}
function build(u,k){const W=u.words,Sn=u.sentences;let q=[];
  if(k==="words")q=[...pick(W,4).map(w=>qListen(u,w)),...pick(W,3).map(w=>qMean(u,w)),...pick(W,3).map(w=>qSpell(u,w))];
  if(k==="sent")q=[...Sn.map(s=>qOrder(u,s)),...pick(Sn,2).map(s=>qDict(u,s)),...pick(Sn,2).map(s=>qSent(u,s))];
  if(k==="speak")q=[...pick(W,4),...pick(Sn,3)].map(x=>qSpeak(u,x));
  if(k==="mix")q=[...pick(W,3).map(w=>qListen(u,w)),...pick(W,2).map(w=>qMean(u,w)),...pick(W,2).map(w=>qSpell(u,w)),...pick(Sn,2).map(s=>qOrder(u,s)),qDict(u,pick(Sn,1)[0]),...(SR?[qSpeak(u,pick(Sn,1)[0])]:[])];
  if(k==="review"){const ws=Object.values(S.wrong).sort((a,b)=>b.n-a.n).slice(0,10);
    q=ws.map(w=>{const uu=UNITS.find(x=>x.id===w.u);return w.item[0].includes(" ")?qOrder(uu,w.item):(Math.random()<.5?qSpell(uu,w.item):qMean(uu,w.item))})}
  if(k!=="speak"&&!SR)q=q.filter(x=>x.t!=="speak");
  return k==="mix"||k==="words"?shuf(q):q}

// ---- lesson engine ----
let L=null;
function startLesson(u,k){
  if(S.limit&&dayRec().min>=S.limit){alert("今天的学习时间到啦，明天继续！");return}
  if(S.hearts<=0&&k!=="review"){alert("❤️ 用完了！去错题本复习可以恢复1颗心，明天会自动补满。");return}
  const qs=build(u,k);if(!qs.length){alert("暂时没有题目");return}
  L={u,k,qs,i:0,right:0,start:Date.now(),combo:0};lesson.style.display="flex";showQ()}
function showQ(){const q=L.qs[L.i];L.sel=null;L.typed=[];
  let body="";
  if(q.t==="listen"||q.t==="mean")body=`${q.audio&&!(q.t==="mean"&&q.item[0].includes(" "))?`<div class="prompt"><button class="spk" id="ply">🔊</button>${q.t==="mean"?`<b>${esc(q.audio)}</b>`:""}</div>`:""}
    <div class="opts">${q.opts.map(o=>`<button class="opt">${esc(o)}</button>`).join("")}</div>`;
  if(q.t==="spell")body=`<div class="prompt"><button class="spk" id="ply">🔊</button><small style="color:#777">点喇叭听发音</small></div><input class="ans" id="inp" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="在这里输入英文">`;
  if(q.t==="order")body=`<div class="prompt"><button class="spk" id="ply">🔊</button></div><div class="tiles" id="picked"></div><div class="tiles" style="border:0">${q.tiles.map((t,i)=>`<button class="tile" data-i="${i}">${esc(t)}</button>`).join("")}</div>`;
  if(q.t==="speak")body=`<div class="prompt"><button class="spk" id="ply">🔊</button><b>${esc(q.text)}</b></div><button class="btn blue" id="mic">🎤 按下开始说</button><p id="heard" style="color:#777"></p><button class="btn ghost" id="skip">现在不方便说</button>`;
  lesson.innerHTML=`<div class="ltop"><button class="x" id="quit">✕</button><div class="bar"><i style="width:${L.i/L.qs.length*100}%"></i></div><span>❤️${S.hearts}</span></div>
  <div class="q"><h2>${esc(q.h)}</h2>${body}</div><div class="foot" id="foot"><div class="msg" id="fmsg"></div><button class="btn gray" id="chk">检查</button></div>`;
  quit.onclick=()=>{if(confirm("确定退出？本次进度不会保存"))endLesson(true)};
  const p=document.getElementById("ply");if(p){p.onclick=()=>say(q.audio);if(q.t!=="mean")setTimeout(()=>say(q.audio),300)}
  const ready=v=>{chk.className="btn"+(v?"":" gray")};
  lesson.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{lesson.querySelectorAll(".opt").forEach(x=>x.classList.remove("sel"));b.classList.add("sel");L.sel=b.textContent;ready(1)});
  const inp=document.getElementById("inp");if(inp){inp.focus();inp.oninput=()=>{L.sel=inp.value;ready(inp.value.trim())};inp.onkeydown=e=>{if(e.key==="Enter"&&inp.value.trim())chk.click()}}
  lesson.querySelectorAll(".tile[data-i]").forEach(t=>t.onclick=()=>{t.classList.add("used");L.typed.push(t);
    const b=document.createElement("button");b.className="tile";b.textContent=t.textContent;b.onclick=()=>{b.remove();t.classList.remove("used");L.typed=L.typed.filter(x=>x!==t);L.sel=L.typed.map(x=>x.textContent).join(" ");ready(L.typed.length)};
    picked.appendChild(b);L.sel=L.typed.map(x=>x.textContent).join(" ");ready(1)});
  if(q.t==="speak"){skip.onclick=()=>{L.qs.splice(L.i,1);L.i>=L.qs.length?finish():showQ()};
    mic.onclick=()=>{if(!SR){heard.textContent="这个浏览器不支持语音识别，请用 Chrome。";return}
      const r=new SR();r.lang="en-US";r.maxAlternatives=3;mic.textContent="🎙️ 正在听…";
      r.onresult=e=>{const alts=[...e.results[0]].map(a=>a.transcript);L.sel=alts.find(a=>score(a,q.ans)>=.7)||alts[0];heard.textContent="我听到："+L.sel;ready(1)};
      r.onend=()=>mic.textContent="🎤 再说一次";r.onerror=()=>heard.textContent="没听清，再试一次";r.start()}}
  chk.onclick=()=>{if(chk.classList.contains("gray"))return;check()}}
function score(a,b){const A=norm(a).split(" "),B=norm(b).split(" ");return B.filter(w=>A.includes(w)).length/B.length}
function check(){const q=L.qs[L.i];let ok;
  if(q.t==="speak")ok=score(L.sel||"",q.ans)>=.7;
  else if(q.t==="mean"||q.t==="listen")ok=L.sel===q.ans;
  else ok=norm(L.sel||"")===norm(q.ans);
  lesson.querySelectorAll(".opt").forEach(b=>{if(b.textContent===q.ans)b.classList.add("good");else if(b.classList.contains("sel")&&!ok)b.classList.add("bad")});
  const d=dayRec();d.total++;const key=q.item[0];
  if(ok){L.right++;L.combo++;d.right++;if(S.wrong[key]){S.wrong[key].n--;if(S.wrong[key].n<=0)delete S.wrong[key]}
    foot.className="foot ok";fmsg.textContent=L.combo>=3?`🔥 连对 ${L.combo} 题！`:pick(["太棒了！","Great!","Nice job!","正确！"],1)[0]}
  else{L.combo=0;if(L.k!=="review")S.hearts=Math.max(0,S.hearts-1);
    S.wrong[key]={item:q.item,u:L.u.id,n:(S.wrong[key]?.n||0)+1};
    foot.className="foot no";fmsg.innerHTML=`正确答案：${esc(q.t==="mean"&&q.item[1]===q.ans?q.ans:q.ans)}`;if(q.audio)say(q.ans.match(/[a-z]/i)?q.ans:q.audio)}
  save();chk.className="btn"+(ok?"":" blue");chk.textContent="继续";
  chk.onclick=()=>{L.i++;if(L.i>=L.qs.length||(S.hearts<=0&&L.k!=="review"))finish();else showQ()}}
function finish(){const d=dayRec();const mins=(Date.now()-L.start)/60000;const total=L.qs.length;
  const acc=total?Math.round(L.right/L.qs.length*100):0;let xp=L.right*2+(acc===100?5:0);
  d.xp+=xp;d.min+=mins;S.xp+=xp;
  if(S.lastDay!==today()){const y=new Date(Date.now()-864e5).toLocaleDateString("sv");S.streak=S.lastDay===y?S.streak+1:1;S.lastDay=today()}
  if(L.k==="mix"&&acc>=70)S.unit[L.u.id]=Math.max(S.unit[L.u.id]||0,acc===100?3:acc>=85?2:1);
  if(L.k==="review"&&L.right>0)S.hearts=Math.min(5,S.hearts+1);
  save();
  lesson.innerHTML=`<div class="done"><div class="big">${acc>=85?"🏆":acc>=60?"🎉":"💪"}</div><h1>${acc>=85?"太厉害了！":acc>=60?"完成啦！":"继续加油！"}</h1>
  <div class="stats"><div>💎 +${xp} XP</div><div>🎯 ${acc}%</div><div>⏱️ ${Math.max(1,Math.round(mins))} 分钟</div></div>
  ${L.k==="mix"&&acc<70?"<p>单元挑战正确率达到 70% 才能解锁下一单元哦</p>":""}<button class="btn" id="ok">继续</button></div>`;
  ok.onclick=()=>endLesson()}
function endLesson(){lesson.style.display="none";L=null;render()}

// ---- other views ----
function reviewView(){const ws=Object.values(S.wrong).sort((a,b)=>b.n-a.n);
  return `<div class="page"><h1>📕 错题本</h1><div class="sub">做错的题会出现在这里，复习做对就移出</div>
  ${ws.length?`<button class="btn" id="rv">开始复习 (${Math.min(10,ws.length)}题) · 可恢复❤️</button><table style="margin-top:14px">${ws.map(w=>`<tr data-s="${esc(w.item[0])}"><td>🔊 ${esc(w.item[0])}</td><td>${w.item[1]}</td><td>×${w.n}</td></tr>`).join("")}</table>`:"<p style='text-align:center'>🎈 暂时没有错题</p>"}</div>`}
const BADGES=[["🔥","连续3天",()=>S.streak>=3],["🌟","连续7天",()=>S.streak>=7],["💎","100 XP",()=>S.xp>=100],["👑","500 XP",()=>S.xp>=500],
  ["🗺️","通关第1单元",()=>S.unit[1]>=1],["🚀","通关第5单元",()=>S.unit[5]>=1],["🏛️","全部通关",()=>UNITS.every(u=>S.unit[u.id]>=1)],["⭐","任一单元三星",()=>Object.values(S.unit).some(v=>v>=3)],["📕","错题清零",()=>S.xp>0&&!Object.keys(S.wrong).length]];
function meView(){return `<div class="page"><h1>🏅 我的成就</h1><div class="stats"><div>🔥 ${S.streak} 天</div><div>💎 ${S.xp} XP</div><div>⭐ ${Object.values(S.unit).reduce((a,b)=>a+b,0)}</div></div>
  <div class="badges">${BADGES.map(b=>`<div class="badge ${b[2]()?"":"off"}"><i>${b[0]}</i>${b[1]}</div>`).join("")}</div></div>`}
function parentView(){const days=[...Array(7)].map((_,i)=>new Date(Date.now()-i*864e5).toLocaleDateString("sv")).reverse();
  return `<div class="page"><h1>👨‍👩‍👧 家长面板</h1><div class="sub">近7天学习情况（数据只保存在这台设备的浏览器里）</div>
  <table><tr><th>日期</th><th>分钟</th><th>XP</th><th>正确率</th></tr>${days.map(d=>{const r=S.days[d]||{min:0,xp:0,right:0,total:0};
    return `<tr><td>${d.slice(5)}</td><td>${Math.round(r.min)}</td><td>${r.xp}</td><td>${r.total?Math.round(r.right/r.total*100)+"%":"-"}</td></tr>`}).join("")}</table>
  <h3>单元进度</h3><table>${UNITS.map(u=>`<tr><td>U${u.id} ${u.title}</td><td>${"⭐".repeat(S.unit[u.id]||0)||"未通关"}</td></tr>`).join("")}</table>
  <h3>设置</h3>
  <label class="row">每日目标 XP <input id="sg" type="number" value="${S.goal}" style="width:80px"></label>
  <label class="row">每日时长上限（分钟，0=不限）<input id="sl" type="number" value="${S.limit}" style="width:80px"></label>
  <label class="row">家长密码（4位，留空=不设）<input id="sp" type="password" value="${S.pin}" style="width:80px"></label>
  <button class="btn blue" id="ss">保存设置</button>
  <button class="btn ghost" id="ex">导出学习记录</button><button class="btn ghost" id="unlock">解锁全部单元</button></div>`}

function bind(){const m=document.getElementById("main");
  m.querySelectorAll(".unit").forEach(el=>el.onclick=()=>{const u=UNITS.find(x=>x.id==el.dataset.u);if(!unlocked(u)){alert("先通过上一单元的「单元挑战」才能解锁哦");return}unitMenu(u)});
  m.querySelectorAll("tr[data-s]").forEach(r=>r.onclick=()=>say(r.dataset.s));
  const rv=document.getElementById("rv");if(rv)rv.onclick=()=>startLesson({id:0,title:"Review"},"review");
  const ss=document.getElementById("ss");if(ss){ss.onclick=()=>{S.goal=+sg.value||30;S.limit=+sl.value||0;S.pin=sp.value.trim();save();alert("已保存")};
    ex.onclick=()=>{const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([JSON.stringify(S,null,1)],{type:"application/json"}));a.download="english6-progress.json";a.click()};
    unlock.onclick=()=>{if(confirm("解锁全部单元？")){UNITS.forEach(u=>S.unit[u.id]=S.unit[u.id]||0);UNITS.slice(0,-1).forEach(u=>S.unit[u.id]=Math.max(S.unit[u.id],1));save();alert("已解锁")}}}}
speechSynthesis&&speechSynthesis.getVoices();
render();
</script>
</body>
</html>
